services:
  app:
    build: .
    command:
      - node
      - --max-old-space-size=${HEAP_MB:-256}
      - dist/angular-router-redirectfunction-ssr-oom-lab/server/server.mjs
    environment:
      HOST: 0.0.0.0
      PORT: 4000
    mem_limit: 1536m
    restart: "no"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30
  nginx:
    image: nginx:1.30.5-alpine
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: "no"
